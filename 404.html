<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- GitHub Pages sirve esta página para cualquier dirección que no existe
         (un enlace viejo, una letra mal escrita). Sin JavaScript: tiene que
         funcionar aunque falle todo lo demás. -->
    <meta name="robots" content="noindex">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Página no encontrada — Ale ventas Alerce</title>
    <meta name="theme-color" content="#6b21a8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap">
    <link rel="stylesheet" href="/src/styles/error.css">
  </head>
  <body>
    <main class="e404">
      <img src="/img/logo.webp" alt="" width="96" height="96">
      <p class="e404-codigo" aria-hidden="true">404</p>
      <h1>No encontramos esta página</h1>
      <p>Puede que el enlace esté incompleto o que la página se haya movido. El catálogo sigue en su lugar.</p>
      <div class="e404-acciones">
        <a class="btn btn-primario" href="%BASE_URL%">Ir al catálogo</a>
        <a class="btn btn-borde" href="https://wa.me/56950446613" rel="noopener noreferrer">Escríbenos por WhatsApp</a>
      </div>
    </main>
  </body>
</html>
