# Publica el sitio en GitHub Pages en cada push a main.
# `npm run build` incluye `npm run check`: si algo falla, no se publica.
#
# Endurecido tras la auditoría (SECURITY.md, L5):
# - Dos trabajos: el que construye NO tiene ningún permiso de escritura; el
#   que publica solo puede escribir en Pages (no en el repositorio).
# - `npm ci --ignore-scripts`: ningún script de instalación de una dependencia
#   se ejecuta en el runner (vía clásica de robo de tokens en CI).
# - Acciones fijadas por SHA, no por etiqueta movible.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada 2 horas se republica para refrescar la foto del catálogo
  # (data/vivo.json, ver scripts/foto-catalogo.js) con precios y stock de la
  # hoja. GitHub pausa los programados tras 60 días sin actividad en el repo:
  # si pasa, se reactivan desde la pestaña Actions.
  schedule:
    - cron: '17 */2 * * *'

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
